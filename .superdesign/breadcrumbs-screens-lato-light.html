<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>Breadcrumbs — Lato Light (Superdesign Foundation)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
.bca{display:flex;flex-direction:column;align-items:center;padding:1.5rem 0 1rem;gap:1.25rem;}
.bca *{box-sizing:border-box;margin:0;padding:0;}
.bc-meta{display:flex;align-items:center;gap:12px;}
.bc-label{font-family:'Lato',sans-serif;font-size:10px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--color-text-secondary);}
.bc-role{font-family:'Lato',sans-serif;font-size:9px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:4px;}
.bc-phone{width:288px;height:588px;border-radius:46px;border:8px solid #1C1C1E;overflow:hidden;position:relative;flex-shrink:0;background:#0D0D0D;}
.bc-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:86px;height:27px;background:#000;border-radius:20px;z-index:20;pointer-events:none;}
.bc-scr{width:100%;height:100%;display:none;flex-direction:column;position:absolute;top:0;left:0;}
.bc-scr.on{display:flex;}
.bc-sb{display:flex;justify-content:space-between;align-items:center;padding:50px 20px 6px;flex-shrink:0;font-family:'Lato',sans-serif;font-size:12px;font-weight:300;}
.bc-bd{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:0 18px;}
.bc-hm{height:26px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;flex-shrink:0;}
.bc-hp{width:108px;height:4px;border-radius:2px;opacity:.22;}
.bc-nav{display:flex;align-items:center;gap:16px;}
.bc-btn{width:38px;height:38px;border-radius:50%;border:.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Lato',sans-serif;}
.bc-btn:hover{background:var(--color-background-secondary);}
.bc-dots{display:flex;align-items:center;gap:5px;}
.bc-dot{width:6px;height:6px;border-radius:3px;background:var(--color-border-secondary);transition:all .2s;cursor:pointer;}
.bc-dot.on{width:20px;background:#3B82F6;}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
:root{
  --color-text-secondary:#888;
  --color-border-secondary:#333;
  --color-background-primary:#1a1a1a;
  --color-text-primary:#F7F5F2;
  --color-background-secondary:#222;
}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;font-family:'Lato',sans-serif;}
</style>
</head>

];

let cur=0;
const ph=document.getElementById('bc-ph');
const lbl=document.getElementById('bc-lbl');
const rl=document.getElementById('bc-rl');
const ds=document.getElementById('bc-ds');

function buildDots(){
  ds.innerHTML='';
  scrs.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='bc-dot'+(i===cur?' on':'');
    d.onclick=()=>{cur=i;render();};
    ds.appendChild(d);
  });
}

function render(){
  const s=scrs[cur];
  ph.querySelectorAll('.bc-scr').forEach(e=>e.remove());
  const el=document.createElement('div');
  el.className='bc-scr on';
  el.style.cssText=`background:${s.bg};`;
  const isDk=s.bg===OB;
  const sc=isDk?LN:OB;
  el.innerHTML=`
    <div class="bc-sb" style="color:${sc};">
      <span style="font-family:${F};font-size:13px;font-weight:400;">10:31</span>
      <span style="font-family:${F};font-size:11px;font-weight:300;opacity:.4;">●●● WiFi 100%</span>
    </div>
    <div class="bc-bd">${s.h}</div>
    <div class="bc-hm"><div class="bc-hp" style="background:${sc};"></div></div>`;
  ph.appendChild(el);
  lbl.textContent=`${cur+1} / ${scrs.length} — ${s.n}`;
  if(s.role){
    const isRcv=s.role==='Receiver';
    rl.textContent=s.role;
    rl.style.cssText=`font-family:${F};font-size:9px;font-weight:300;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:4px;background:${isRcv?'#050C18':'#E8E4DC'};color:${isRcv?BL:'#888'};`;
  } else {
    rl.textContent='';rl.style.cssText='';
  }
  buildDots();
}

function bcP(){cur=(cur-1+scrs.length)%scrs.length;render();}
function bcN(){cur=(cur+1)%scrs.length;render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')bcP();if(e.key==='ArrowRight')bcN();});
render();
</script>
