<!DOCTYPE html>
<html lang="en" style="height:100%">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Breadcrumbs — Write</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      hsl(30 13% 9%);      /* #1A1714 */
    --fg:      hsl(37 39% 94%);     /* #F5F0E8 */
    --card:    hsl(30 13% 12%);
    --border:  hsl(30 10% 18%);
    --muted:   hsl(30 4% 55%);
    --font-ui: 'Inter', system-ui, sans-serif;
    --font-display: 'Playfair Display', Georgia, serif;
  }

  html, body {
    height: 100%; background: var(--bg); color: var(--fg);
    font-family: var(--font-ui); font-size: 16px;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
  }

  /* ── Page shell ── */
  .page {
    min-height: 100vh; max-width: 440px; margin: 0 auto;
    padding: 1.5rem 1.25rem 6rem;
    display: flex; flex-direction: column; gap: 1.5rem;
  }

  /* ── Header ── */
  .page-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 0.5rem;
  }
  .page-header .date-label {
    font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(245,240,232,0.35);
  }
  .page-header .settings-btn {
    font-size: 0.875rem; color: var(--muted); cursor: pointer;
    min-height: 44px; display: flex; align-items: center;
  }

  /* ── Recipient pills ── */
  .recipient-block { text-align: center; display: flex; flex-direction: column; gap: 0.625rem; }
  .recipient-label {
    font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(245,240,232,0.28);
  }
  .recipient-pills { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
  .pill {
    padding: 0.5rem 0.875rem; font-size: 0.875rem; border-radius: 9999px;
    border: 1px solid; cursor: pointer; min-height: 44px;
    display: flex; align-items: center; transition: all 0.15s;
  }
  .pill.active   { border-color: var(--fg);                 color: var(--fg); }
  .pill.inactive { border-color: rgba(245,240,232,0.18);    color: rgba(245,240,232,0.45); }

  /* ── Mode tabs ── */
  .mode-tabs { display: flex; align-items: center; justify-content: center; gap: 1.5rem; }
  .mode-tab {
    font-size: 0.75rem; letter-spacing: 0.03em; text-transform: capitalize;
    padding: 0 0.75rem; min-height: 44px; display: flex; align-items: center;
    cursor: pointer; border-bottom: 1px solid; transition: all 0.15s;
  }
  .mode-tab.active   { color: var(--fg);                    border-color: rgba(245,240,232,0.5); }
  .mode-tab.inactive { color: rgba(245,240,232,0.25);       border-color: transparent; }

  /* ── Textarea ── */
  .write-area {
    width: 100%; min-height: 38vh; background: transparent; border: none; outline: none;
    color: var(--fg); font-family: var(--font-ui); font-size: 1.0625rem;
    line-height: 1.55; letter-spacing: -0.01em; resize: none;
    caret-color: var(--fg);
  }
  .write-area::placeholder { color: rgba(245,240,232,0.16); }

  /* ── Spark hint (shows after 10s idle) ── */
  .spark-block {
    border-top: 1px solid rgba(245,240,232,0.06); padding-top: 0.875rem;
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  .spark-label {
    font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(245,240,232,0.2);
  }
  .spark-text { font-size: 0.875rem; line-height: 1.65; color: rgba(245,240,232,0.45); }
  .spark-refresh { font-size: 0.75rem; color: rgba(245,240,232,0.2); cursor: pointer; width: fit-content; min-height: 44px; display: flex; align-items: center; }

  /* ── Pre-save section (appears when content exists) ── */
  .presave {
    display: flex; flex-direction: column; gap: 1.25rem;
    border-top: 1px solid rgba(245,240,232,0.07); padding-top: 1.25rem;
  }
  .type-block { display: flex; flex-direction: column; gap: 0.625rem; text-align: center; }
  .type-label-sm {
    font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(245,240,232,0.28);
  }
  .type-chips { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
  .type-chip {
    padding: 0.5rem 1rem; font-size: 0.875rem; border-radius: 2px; border: 1px solid;
    cursor: pointer; min-height: 44px; display: flex; align-items: center; transition: all 0.15s;
  }
  .type-chip.active   { border-color: var(--fg); color: var(--fg); background: rgba(245,240,232,0.05); }
  .type-chip.inactive { border-color: rgba(245,240,232,0.16); color: rgba(245,240,232,0.38); }

  /* ── Save button ── */
  .save-btn {
    width: 100%; padding: 1rem; font-size: 0.875rem; letter-spacing: 0.02em;
    border: 1px solid var(--fg); color: var(--fg); background: transparent;
    border-radius: 2px; cursor: pointer; min-height: 44px; transition: all 0.15s;
  }
  .save-btn:hover { background: var(--fg); color: var(--bg); }
  .save-btn.disabled { opacity: 0.28; cursor: not-allowed; }

  /* ── Bottom nav ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: rgba(26,23,20,0.95); backdrop-filter: blur(8px);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; justify-content: center;
  }
  .bottom-nav-inner {
    display: flex; width: 100%; max-width: 440px;
  }
  .nav-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; padding: 0.75rem 0; min-height: 56px; cursor: pointer;
    text-decoration: none;
  }
  .nav-tab.active   { color: var(--fg); }
  .nav-tab.inactive { color: rgba(245,240,232,0.32); }
  .nav-tab span     { font-size: 0.625rem; font-weight: 500; letter-spacing: 0.04em; }
  .nav-tab svg      { width: 22px; height: 22px; }
</style>
</head>
<body>

<div class="page">

  <!-- Header -->
  <header class="page-header">
    <span class="date-label">June 20, 2026</span>
    <span class="settings-btn">Settings</span>
  </header>

  <!-- Recipient -->
  <div class="recipient-block">
    <p class="recipient-label">Who are you speaking to today?</p>
    <div class="recipient-pills">
      <button class="pill active">Cairo</button>
      <button class="pill inactive">Joni</button>
      <button class="pill inactive">Englon</button>
      <button class="pill inactive">Everyone</button>
    </div>
  </div>

  <!-- Mode tabs -->
  <div class="mode-tabs" role="tablist">
    <button class="mode-tab active" role="tab" aria-selected="true">write</button>
    <button class="mode-tab inactive" role="tab" aria-selected="false">voice</button>
  </div>

  <!-- Textarea -->
  <textarea class="write-area" placeholder="What do you want them to remember?"></textarea>

  <!-- Spark hint (visible at idle) -->
  <div class="spark-block">
    <p class="spark-label">Today's Spark</p>
    <p class="spark-text">What's one hard-earned lesson you wish you'd learned ten years earlier?</p>
    <button class="spark-refresh">↻ New spark</button>
  </div>

  <!-- Pre-save section -->
  <div class="presave">
    <div class="type-block">
      <p class="type-label-sm">What kind of breadcrumb is this?</p>
      <div class="type-chips">
        <button class="type-chip active">Message</button>
        <button class="type-chip inactive">Memory</button>
        <button class="type-chip inactive">Lesson</button>
      </div>
    </div>
    <button class="save-btn">Save Breadcrumb</button>
  </div>

</div>

<!-- Bottom Nav -->
<nav class="bottom-nav" aria-label="Main navigation">
  <div class="bottom-nav-inner">
    <!-- Write -->
    <a class="nav-tab active" href="#" aria-current="page">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
      <span>Write</span>
    </a>
    <!-- Library -->
    <a class="nav-tab inactive" href="#">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Library</span>
    </a>
    <!-- Your Story -->
    <a class="nav-tab inactive" href="#">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Your Story</span>
    </a>
    <!-- Hear -->
    <a class="nav-tab inactive" href="#">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>Hear</span>
    </a>
  </div>
</nav>

</body>
</html>
